apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hotel-booking-servicemonitor
  namespace: hotel-app
  labels:
    app: hotel-booking-service
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: hotel-booking-service
  namespaceSelector:
    matchNames:
      - hotel-app
  endpoints:
    - port: http
      path: /metrics
      interval: 10s
      scrapeTimeout: 5s
