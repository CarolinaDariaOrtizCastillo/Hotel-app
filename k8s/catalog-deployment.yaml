apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-catalog-service
  namespace: hotel-app
  labels:
    app: hotel-catalog-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotel-catalog-service
  template:
    metadata:
      labels:
        app: hotel-catalog-service
        tier: backend
    spec:
      containers:
        - name: hotel-catalog
          image: hotel-catalog-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: ARTIFICIAL_DELAY_MS
              value: "0"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
