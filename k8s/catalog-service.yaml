apiVersion: v1
kind: Service
metadata:
  name: hotel-catalog-service
  namespace: hotel-app
  labels:
    app: hotel-catalog-service
    release: prometheus-stack
spec:
  type: NodePort
  selector:
    app: hotel-catalog-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30081
