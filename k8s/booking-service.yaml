apiVersion: v1
kind: Service
metadata:
  name: hotel-booking-service
  namespace: hotel-app
  labels:
    app: hotel-booking-service
    release: prometheus-stack
spec:
  type: NodePort
  selector:
    app: hotel-booking-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      nodePort: 30082
