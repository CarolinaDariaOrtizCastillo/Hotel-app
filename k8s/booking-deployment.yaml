apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-booking-service
  namespace: hotel-app
  labels:
    app: hotel-booking-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotel-booking-service
  template:
    metadata:
      labels:
        app: hotel-booking-service
        tier: backend
    spec:
      containers:
        - name: hotel-booking
          image: hotel-booking-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: CATALOG_SERVICE_URL
              value: "http://hotel-catalog-service.hotel-app.svc.cluster.local:8081"
            - name: CATALOG_TIMEOUT_MS
              value: "2000"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
