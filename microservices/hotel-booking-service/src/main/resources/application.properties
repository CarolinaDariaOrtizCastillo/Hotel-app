server.port=8082
spring.application.name=hotel-booking-service

# Expose Actuator and Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true

# Catalog Service communication (overridable via env in K8s)
hotel.catalog.service-url=${CATALOG_SERVICE_URL:http://localhost:8081}
hotel.catalog.timeout-ms=${CATALOG_TIMEOUT_MS:2000}
