server.port=8081
spring.application.name=hotel-catalog-service

# Expose Actuator and Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true

# Artificial delay for Casuistica 2 (configurable via env var)
hotel.catalog.artificial-delay-ms=${ARTIFICIAL_DELAY_MS:0}
